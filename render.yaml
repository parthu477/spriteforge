services:
  - type: web
    name: spriteforge
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -c "import os; os.environ['U2NET_HOME']='backend/data/models'; import rembg; rembg.new_session('u2netp')"
    startCommand: gunicorn "backend.app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    # Note: On the free plan, Render uses ephemeral local storage.
    # To attach a persistent disk ($0.25/GB/mo), upgrade to "plan: starter" and uncomment the disk section:
    # disk:
    #   name: spriteforge-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: ASSET_DIR
        value: assets/sprites
      - key: USERS_DB_PATH
        value: backend/data/users.db
      - key: PROVIDER
        value: cloudflare
      - key: FALLBACK_PROVIDER
        value: mock
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: CF_MODEL_ID
        value: "@cf/black-forest-labs/flux-1-schnell"
      - key: CF_STEPS
        value: "4"
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: FLASK_DEBUG
        value: "false"
      - key: REMBG_MODEL
        value: u2netp
      - key: U2NET_HOME
        value: backend/data/models
      - key: OMP_NUM_THREADS
        value: "1"
      - key: LOG_LEVEL
        value: INFO
