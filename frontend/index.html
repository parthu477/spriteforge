<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SpriteForge — AI sprite sheet generator for game developers. Generate animated pixel art sprites using FLUX.1 schnell.">
  <title>SpriteForge — AI Sprite Sheet Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">SpriteForge</span>
    </div>
    <a href="/api/health" target="_blank" class="nav-health" id="health-indicator" title="API Health">● Live</a>
  </nav>

  <main class="container">
    <header class="hero">
      <h1 class="hero-title">
        <span class="gradient-text">AI Sprite Sheet</span><br>Generator
      </h1>
      <p class="hero-sub">Describe your character → get a game-ready animated sprite sheet in seconds.</p>
    </header>

    <section class="generator-card" aria-label="Sprite Generator">
      <form id="generate-form" novalidate>
        <input type="hidden" id="csrf-token" value="{{ csrf_token }}">

        <div class="form-group">
          <label for="prompt-input" class="form-label">Character Description <span class="required">*</span></label>
          <textarea
            id="prompt-input"
            name="prompt"
            class="form-textarea"
            placeholder="e.g. a knight in silver armour walking to the right"
            rows="3"
            maxlength="300"
            required
          ></textarea>
          <div class="char-count"><span id="prompt-count">0</span>/300</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="name-input" class="form-label">Sprite Name <span class="optional">(optional)</span></label>
            <input type="text" id="name-input" name="name" class="form-input" placeholder="knight_walk" maxlength="48">
          </div>

          <div class="form-group">
            <label for="style-select" class="form-label">Art Style <span class="required">*</span></label>
            <select id="style-select" name="style" class="form-select" required>
              <option value="pixel_art" selected>Pixel Art</option>
              <option value="cartoon">Cartoon</option>
              <option value="painterly">Painterly</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Animation Grid <span class="required">*</span></label>
            <div class="grid-options" role="group" aria-label="Grid selection">
              <label class="grid-pill active"><input type="radio" name="grid" value="1x4" checked>1×4</label>
              <label class="grid-pill"><input type="radio" name="grid" value="1x6">1×6</label>
              <label class="grid-pill"><input type="radio" name="grid" value="1x8">1×8</label>
              <label class="grid-pill"><input type="radio" name="grid" value="2x4">2×4</label>
              <label class="grid-pill"><input type="radio" name="grid" value="4x4">4×4</label>
            </div>
          </div>

          <div class="form-group">
            <label for="seed-input" class="form-label">Seed <span class="optional">(optional)</span></label>
            <div class="seed-row">
              <input type="number" id="seed-input" name="seed" class="form-input" placeholder="random" min="0" max="4294967295">
              <button type="button" id="random-seed-btn" class="btn-icon" title="Randomise seed">🎲</button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-generate" id="generate-btn">
          <span class="btn-text">✨ Generate Sprite</span>
          <span class="btn-loader" hidden></span>
        </button>

        <div id="form-error" class="form-error" role="alert" hidden></div>
      </form>
    </section>

    <!-- Job status / result -->
    <section id="result-section" class="result-section" hidden aria-live="polite">
      <div class="status-bar">
        <div class="status-spinner" id="status-spinner"></div>
        <div class="status-info">
          <span id="status-text" class="status-text">Processing…</span>
          <span id="progress-eta" class="progress-eta" hidden></span>
        </div>
        <span id="progress-percent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar-container" id="progress-bar-container" role="progressbar" aria-label="Generation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
      <div class="progress-stages" id="progress-stages"></div>
      <div id="result-card" class="result-card" hidden>
        <img id="result-img" src="" alt="Generated sprite sheet" class="result-img">
        <div class="result-meta" id="result-meta"></div>
        <div class="result-actions">
          <a id="download-btn" href="#" download class="btn-secondary">⬇ Download</a>
          <button id="reroll-btn" class="btn-secondary">🎲 Re-roll</button>
        </div>
      </div>
    </section>

    <!-- Gallery -->
    <section class="gallery-section" id="gallery-section">
      <div class="section-header">
        <h2 class="section-title">Sprite Gallery</h2>
        <button id="refresh-gallery" class="btn-icon-text" title="Refresh">↻ Refresh</button>
      </div>
      <div class="gallery-grid" id="gallery-grid">
        <p class="gallery-empty">No sprites yet — generate one above!</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>SpriteForge · Built with FLUX.1 schnell · All generation local to your machine</p>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
